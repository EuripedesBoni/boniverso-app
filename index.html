<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101D38" />
  <meta name="description" content="BoniVerso: seu universo de conhecimento. Cursos de redação, língua portuguesa, literatura e planejamento de estudos. Uma plataforma RSB Educação." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>BoniVerso | RSB Educação</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand" role="banner">
        <img src="icon-192.png" class="brand-icon" alt="Ícone BoniVerso" />
        <div class="brand-text"><div class="wordmark">Boni<span>Verso</span></div><div class="brand-caption">por RSB Educação</div></div>
      </div>
      <div class="workspace-label">SEU ESPAÇO</div>
      <nav class="side-nav" aria-label="Navegação principal" id="sideNav"></nav>
      <div class="side-bottom">
        <div class="small-quote"><span class="sparkle">✦</span><span>Seu universo de<br/>conhecimento.</span></div>
        <div class="profile-switch" id="profileSwitch"></div>
        <div class="sidebar-note">PRÉVIA • MODO DEMONSTRAÇÃO</div>
      </div>
    </aside>
    <div class="mobile-shade" id="shade"></div>
    <div class="main-column">
      <header class="topbar">
        <div class="topbar-left"><button class="icon-btn menu-button" id="menuToggle" aria-label="Abrir menu"><span data-icon="menu"></span></button><div><div class="breadcrumb">INSTITUTO RSB EDUCAÇÃO <span class="bread-slash">/</span> <span id="breadcrumb">Início</span></div><div class="top-greeting" id="topGreeting">Olá, estudante <span>✦</span></div></div></div>
        <div class="top-actions"><span class="demo-pill"><span class="pulse-dot"></span> Protótipo funcional</span><button class="top-search" id="searchButton"><span data-icon="search"></span><span>Buscar cursos</span><kbd>⌕</kbd></button><button class="circle-button" id="notifications" title="Avisos"><span data-icon="bell"></span></button><button class="top-avatar" id="topAvatar" title="Abrir perfil">E</button></div>
      </header>
      <main id="view" aria-live="polite"></main>
      <footer class="footer"><span>© <span id="thisYear"></span> BoniVerso · Uma plataforma RSB Educação</span><span>Seu universo de conhecimento. ✦</span></footer>
    </div>
    <nav class="mobile-bottom" id="mobileBottom" aria-label="Navegação rápida"></nav>
  </div>
  <div class="toast-region" id="toasts" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"><div id="dialogContents"></div></dialog>
  <script src="config.js"></script>
  <script type="module" src="bootstrap.js"></script>
</body>
</html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoniVerso Live · RSB Educação</title><style>
:root{font-family:system-ui,Arial;background:#0d1933;color:#f3f6ff}*{box-sizing:border-box}body{margin:0}header{padding:17px 24px;border-bottom:1px solid #34445f;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}header b{font-size:23px}header b span{color:#e7c788}a{color:#e7c788}main{max-width:1400px;margin:0 auto;padding:18px}.notice{border:1px solid #45618c;padding:12px 15px;border-radius:12px;margin-bottom:15px}button{cursor:pointer;padding:11px 15px;border:1px solid #556e9b;background:#1f3761;color:white;border-radius:12px;font:inherit}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:#bb9455;color:#101a31;border-color:#bb9455;font-weight:750}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:13px}.tile{background:#15274b;border-radius:15px;overflow:hidden;min-height:195px;border:1px solid #394e72;position:relative}.tile video{width:100%;height:220px;object-fit:cover;background:#0c1529}.tile p{padding:9px;margin:0;font-size:13px}section{margin:20px 0}h2{font-size:17px}.request{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0;padding:10px;border:1px solid #354868;border-radius:10px}#requestList:empty:after{content:'Nenhum pedido pendente';color:#a9b7d1}small{color:#acbad2}#message{white-space:pre-wrap}
</style></head><body><header><b>Boni<span>Verso</span> <small>LIVE</small></b><a href="./aparecida.html">← Voltar à turma</a></header><main><div class="notice" id="message" role="status">Preparando a sala segura…</div><div class="toolbar"><button id="join" class="primary">Entrar na aula</button><button id="mic" disabled>Ativar microfone</button><button id="cam" disabled>Ativar câmera</button><button id="screen" disabled>Compartilhar tela</button><button id="ask" disabled>Solicitar a palavra</button><button id="leave" disabled>Sair</button></div><section><h2>Participantes</h2><div id="videos" class="grid"></div></section><section id="teacher" hidden><h2>Solicitações de câmera e microfone</h2><small>As autorizações são individuais. Ao permitir, o aluno terá opção de ativar seus dispositivos.</small><div id="requestList"></div></section></main><script src="./config.js"></script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.2';
import {Room,RoomEvent,Track} from 'https://esm.sh/livekit-client@2.15.7';
const $=id=>document.getElementById(id);const cfg=window.BONIVERSO_CONFIG;const db=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);let room=null,authUser=null,joinedPublish=false,sessionId=new URLSearchParams(location.search).get('sessao'),teacher=false,allow=false;const uuid=/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i;const status=s=>$('message').textContent=s;
if(!uuid.test(sessionId||''))status('Link da aula inválido.');
function tile(id,label){let el=document.getElementById('tile-'+id);if(!el){el=document.createElement('div');el.id='tile-'+id;el.className='tile';const p=document.createElement('p');p.textContent=label;el.append(p);$('videos').append(el)}return el}
function renderTrack(track,p){const id=p.identity+'-'+track.sid;let el=tile(id,p.name||p.identity.slice(0,8));const media=track.attach();media.autoplay=true;media.playsInline=true;if(track.kind===Track.Kind.Video)media.muted=p===room.localParticipant;el.prepend(media)}
function detach(track,p){track.detach().forEach(x=>x.remove());document.getElementById('tile-'+p.identity+'-'+track.sid)?.remove()}
async function token(){const {data:{session}}=await db.auth.getSession();if(!session)throw Error('É necessário entrar na sua conta no BoniVerso.');authUser=session.user;const res=await fetch(cfg.supabaseUrl+'/functions/v1/boniverso-live-token',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:cfg.supabasePublishableKey,'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId})});const d=await res.json();if(!res.ok)throw Error(d.error||'Acesso negado');return d}
async function refreshPermission(){const d=await token();teacher=d.is_teacher;allow=d.can_publish;if(room){if(!allow){await room.localParticipant.setMicrophoneEnabled(false);await room.localParticipant.setCameraEnabled(false)}if(room && allow!==joinedPublish){status('Sua permissão mudou. Saia e entre novamente para aplicá-la.');} $('mic').disabled=!joinedPublish;$('cam').disabled=!joinedPublish;$('screen').disabled=!teacher;$('ask').disabled=teacher||allow;$('teacher').hidden=!teacher;}return d}
async function join(){try{$('join').disabled=true;const d=await refreshPermission();room=new Room({adaptiveStream:true,dynacast:true});room.on(RoomEvent.LocalTrackPublished,(publication)=>{if(publication.track)renderTrack(publication.track,room.localParticipant)});room.on(RoomEvent.TrackSubscribed,(track,pub,p)=>renderTrack(track,p));room.on(RoomEvent.TrackUnsubscribed,(track,pub,p)=>detach(track,p));room.on(RoomEvent.Disconnected,()=>status('Conexão encerrada.'));await room.connect(d.url,d.token);joinedPublish=d.can_publish;room.remoteParticipants.forEach(p=>p.trackPublications.forEach(pub=>{if(pub.track&&pub.isSubscribed)renderTrack(pub.track,p)}));$('leave').disabled=false;status(teacher?'Conectado como professor.':'Conectado como estudante. '+(allow?'Pode ativar câmera e microfone.':'Aguarde autorização para falar.'));await refreshPermission();if(teacher)await requests();}catch(e){status(e.message);$('join').disabled=false}}
async function requests(){const {data,error}=await db.from('live_speaking_requests').select('id,user_id,status').eq('session_id',sessionId).eq('status','pending');if(error){status('Falha ao carregar pedidos: '+error.message);return;}$('requestList').replaceChildren();for(const r of data||[]){const row=document.createElement('div');row.className='request';const label=document.createElement('span');label.textContent='Aluno '+r.user_id.slice(0,8);row.append(label);for(const state of ['approved','denied']){const b=document.createElement('button');b.textContent=state==='approved'?'Autorizar':'Recusar';b.onclick=async()=>{const {error}=await db.from('live_speaking_requests').update({status:state,updated_at:new Date().toISOString()}).eq('id',r.id);if(error)status(error.message);else requests()};row.append(b)}$('requestList').append(row)}}
$('join').onclick=join;$('mic').onclick=async()=>{try{await room.localParticipant.setMicrophoneEnabled(!room.localParticipant.isMicrophoneEnabled)}catch(e){status(e.message)}};$('cam').onclick=async()=>{try{await room.localParticipant.setCameraEnabled(!room.localParticipant.isCameraEnabled)}catch(e){status(e.message)}};$('screen').onclick=async()=>{try{await room.localParticipant.setScreenShareEnabled(!room.localParticipant.isScreenShareEnabled)}catch(e){status(e.message)}};$('ask').onclick=async()=>{const {error}=await db.from('live_speaking_requests').upsert({session_id:sessionId,user_id:authUser.id,status:'pending',updated_at:new Date().toISOString()},{onConflict:'session_id,user_id'});status(error?'Pedido não enviado: '+error.message:'Solicitação enviada. O professor poderá autorizar.');};$('leave').onclick=async()=>{if(room){await room.disconnect();room=null}location.href='./aparecida.html'};
setInterval(async()=>{if(!room)return;try{if(teacher)await requests();else await refreshPermission()}catch(e){status(e.message)}},6000);
</script></body></html>
